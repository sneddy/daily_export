[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-daily-export"
version = "0.1.0"
description = "Source-preserving Kalshi daily research export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kalshi-daily-ingest-raw-metadata = "kalshi_daily_research.scripts.ingest_raw_metadata:main"
get-kashi-series = "kalshi_daily_research.scripts.get_kashi_series:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["kalshi_daily_research*"]
